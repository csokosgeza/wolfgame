<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WolfGame</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header>
        <h1>WolfGame</h1>
        <p>Egy játék, amelyet egy AI agent fejlesztett MCP segítségével</p>
    </header>
    
    <main>
        <section id="game-container">
            <div id="game-area">
                <!-- Itt jelenik meg a játék -->
                <p>A játék még nem készült el. Az agent fogja fejleszteni.</p>
            </div>
        </section>
        
        <section id="controls">
            <h2>Vezérlés</h2>
            <div id="control-panel">
                <!-- Itt lesznek a vezérlő elemek -->
            </div>
        </section>
        
        <section id="info">
            <h2>Információk</h2>
            <div id="game-info">
                <p>Játékállapot: <span id="game-status">Nem elérhető</span></p>
                <p>Pontszám: <span id="score">0</span></p>
            </div>
        </section>
    </main>
    
    <footer>
        <p>WolfGame - AI agent által fejlesztett játék</p>
    </footer>
    
    <script src="scripts/game.js"></script>
</body>
</html>
